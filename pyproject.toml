[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "no-warthunder-ai"
version = "0.1.0"
description = "Offline TorchRL self-play training and tiny Go policy export for NO WarThunder"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.14.1", "torchrl==0.14.1", "tensordict==0.14.3",
  "numpy>=2.1,<3", "PyYAML>=6.0,<7", "psutil>=7,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
coreml = ["coremltools==9.0"]

[project.scripts]
nowarthunder-ai = "nowarthunder_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
